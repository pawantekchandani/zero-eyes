name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  player:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Player unit tests
        run: python -m unittest discover -s tests -v
      - name: Install into a temporary HOME and check it
        run: |
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/.claude" "$HOME/.config/opencode"
          scripts/install.sh
          scripts/install.sh --check

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install espeak-ng and PulseAudio
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng pulseaudio pulseaudio-utils
      - name: Player unit tests
        run: python -m unittest discover -s tests -v
      - name: Start PulseAudio with a null sink
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci || true
          pactl set-default-sink ci
          pactl info
      - name: Smoke test (espeak-ng, paplay, pause, stop)
        run: tests/linux_smoke.sh
      - name: Install into a temporary HOME and check it
        run: |
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/.claude" "$HOME/.config/opencode"
          scripts/install-linux.sh
          scripts/install-linux.sh --check
